<article class="m-4 text-center">
    <h2>{{ category.name }}</h2>
    <img src="{{ category.image.url }}" alt="{{ category.name }}" class="rounded-circle mx-auto mb-2 category-img img-fluid img-responsive">
    <a class="btn btn-primary btn-sm mt-1" role="button" href="{% url 'category_products' category.slug %}">Ver categoría</a>
</article>
